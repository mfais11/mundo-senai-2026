<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia Rápido de Hardware – Mundo SENAI 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--b:#0B3C8C;--bd:#082B66;--o:#F58220;--g:#5B6573;--gl:#EEF1F5;--u:min(1vw,1.78vh)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--bd);font-family:'Libre Baskerville',Georgia,serif;line-height:1.5}
.s{position:absolute;inset:0 0 calc(var(--u)*5.6) 0;display:none;flex-direction:column;justify-content:center;padding:0 7vw;overflow:hidden}
.s.on{display:flex}
.dec{position:absolute;top:1vh;right:1.5vw;width:calc(var(--u)*27);opacity:.2;z-index:0;pointer-events:none}
.rot{animation:rot 14s linear infinite}.rev{animation:rot 9s linear infinite reverse}
.flow{stroke-dasharray:8 8;animation:fl 1.2s linear infinite}.pulse{animation:pu 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes fl{to{stroke-dashoffset:-16}}@keyframes pu{50%{transform:scale(1.5)}}
@keyframes inA{from{opacity:0;transform:translateX(5vw) scale(.97)}to{opacity:1;transform:none}}
@keyframes outA{to{opacity:0;transform:translateX(-5vw) scale(.97)}}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-25deg)}}
.on .in{animation:inA .7s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.on .dec{animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.on.out .in{animation:outA .4s ease-in both}
.on.out .dec{animation:outA .4s ease-in both}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:4vw;align-items:center;position:relative;z-index:1}
h1{font-size:calc(var(--u)*5);line-height:1.1;margin:.1em 0 .25em;color:var(--b)}
.step{display:inline-block;margin:0;padding:.2em .9em;background:var(--o);color:var(--bd);font-weight:700;font-size:calc(var(--u)*1.5);border-radius:99px}
.lead{font-size:calc(var(--u)*2.3);font-style:italic;margin:0 0 .8em;color:var(--g)}
ul{list-style:none;padding:0;margin:0}
.grid li{font-size:calc(var(--u)*1.85);margin:.55em 0;padding-left:1.3em;position:relative}
.grid li::before{content:"";position:absolute;left:0;top:.5em;width:.6em;height:.6em;background:var(--o);transform:rotate(45deg)}
.quiz{background:var(--gl);border:4px solid var(--b);border-radius:18px;padding:calc(var(--u)*2)}
.quiz h3{margin:0 0 .3em;font-size:calc(var(--u)*1.6);color:var(--o)}
.quiz p{margin:0 0 .5em;font-size:calc(var(--u)*1.85);font-weight:700}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:calc(var(--u)*1.6);padding:.6em .9em;margin:.5em 0;border:3px solid var(--b);background:#fff;color:var(--bd);border-radius:12px;cursor:pointer}
.opt:hover{background:#dfe8f7}
.opt.ok{background:var(--o);border-color:var(--o);font-weight:700}.opt.ok::before{content:"✓ "}
.opt.no{background:var(--gl);color:var(--g);border-color:#b9c0ca;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.quiz .fb{min-height:2.8em;margin:.3em 0 0;font-size:calc(var(--u)*1.5);font-weight:400;color:var(--bd)}
.cover,.contra{align-items:flex-start;position:absolute}
.logos{display:flex;gap:3vw;align-items:center;position:relative;z-index:1}.logos .a{height:calc(var(--u)*6)}.logos .b{height:calc(var(--u)*6)}
.big{font-size:calc(var(--u)*8.6);margin:.15em 0 0;position:relative;z-index:1}.big span{color:var(--o);font-style:italic}
.big+.bar{height:.7vh;width:34vw;background:linear-gradient(90deg,var(--o),var(--b));border-radius:9px;margin:0 0 1.5vh;position:relative;z-index:1}
.on .bar{animation:wd 1.2s .6s both}@keyframes wd{from{width:0}}
.tag{font-size:calc(var(--u)*2.4);font-style:italic;color:var(--g);margin:.4em 0 0;position:relative;z-index:1}
.names{columns:2;column-gap:3vw;font-size:calc(var(--u)*1.7);margin-top:2vh;position:relative;z-index:1}.names li{margin:.15em 0}
.info{position:relative;z-index:1}.info p{font-size:calc(var(--u)*2.6);margin:.5em 0}.info b{color:var(--b)}.info .v{color:var(--o)}
.cta{display:inline-block;margin-top:1vh;padding:.5em 1.2em;background:var(--o);color:var(--bd);font-weight:700;font-size:calc(var(--u)*2.6);border-radius:14px;position:relative;z-index:1}
footer{position:fixed;left:0;right:0;bottom:0;height:calc(var(--u)*5.6);display:flex;align-items:center;gap:2vw;padding:0 1.5vw;background:#fff;z-index:5;border-top:4px solid transparent;border-image:repeating-linear-gradient(90deg,var(--o) 0 24px,var(--b) 24px 48px) 1;animation:belt 2s linear infinite}
@keyframes belt{to{border-image-source:repeating-linear-gradient(90deg,var(--o) 0 24px,var(--b) 24px 48px)}}
footer .th{flex:1;font-size:calc(var(--u)*1.6);color:var(--bd)}footer .th span{color:var(--g);margin-left:1.5em}
footer img{height:calc(var(--u)*3.4)}
.nav{font:inherit;font-size:calc(var(--u)*1.6);font-weight:700;padding:.5em 1.1em;min-height:48px;border:0;border-radius:10px;background:var(--b);color:#fff;cursor:pointer}
.nav:hover{background:var(--o);color:var(--bd)}.nav:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:4px solid var(--o);outline-offset:2px}
@media (max-aspect-ratio:1/1){.grid{grid-template-columns:1fr}.s{overflow:auto;justify-content:flex-start;padding-top:2vh}:root{--u:min(2.2vw,1.78vh)}}
@media (prefers-reduced-motion:reduce){.rot,.rev,.flow,.pulse,footer{animation:none}}
.art{background:var(--gl);border:4px solid var(--b);border-radius:18px;padding:calc(var(--u)*1.5)}.art svg{width:100%;height:auto;max-height:60vh;display:block}.art .rot{animation-duration:3s}#qz{max-width:78vw}#qz .nav{margin-top:.6em}
</style></head><body>

const C=[
["Placa-mãe","Base que conecta e comunica todos os componentes.",["O soquete define qual processador é compatível.","Os slots recebem memória RAM e placa de vídeo.","O chipset coordena a comunicação entre as peças."],"Qual item define o processador compatível?",["Slot PCIe","Soquete","Conector SATA"],1,"O soquete deve corresponder ao modelo do processador."],
["Processador (CPU)","Executa as instruções e os cálculos do computador.",["Os núcleos realizam tarefas em paralelo.","A frequência, em GHz, indica a velocidade.","O encaixe segue o marcador triangular do canto."],"Como o processador é alinhado ao soquete?",["Pelo marcador triangular","Com força até encaixar","Com parafusos"],0,"O encaixe correto dispensa força e evita pinos tortos."],
["Cooler","Dissipa o calor gerado pelo processador.",["A base metálica absorve o calor da CPU.","Aletas e heatpipes distribuem o calor.","A ventoinha expulsa o ar aquecido."],"Qual a função da pasta térmica?",["Colar o cooler","Melhorar a transferência de calor","Aumentar a frequência"],1,"Ela preenche microfalhas entre a CPU e a base do cooler."],
["Memória RAM","Armazena temporariamente os programas em uso.",["É volátil: os dados somem ao desligar.","DDR4 e DDR5 não são intercambiáveis.","Dois pentes ativam o modo dual channel."],"O que ocorre com os dados da RAM ao desligar?",["Permanecem salvos","São enviados à fonte","São apagados"],2,"Por isso é necessário salvar os arquivos no armazenamento."],
["Armazenamento","Guarda arquivos e sistema operacional de forma permanente.",["HD: discos magnéticos, grande capacidade, menor custo.","SSD SATA: memória flash, mais rápido que o HD.","SSD NVMe (M.2): o mais rápido, encaixado na placa."],"Qual armazenamento é o mais rápido?",["SSD NVMe (M.2)","HD","SSD SATA"],0,"O NVMe usa conexão direta com a placa-mãe."],
["Gabinete","Estrutura que abriga, protege e ventila os componentes.",["O padrão (ATX, Micro-ATX, Mini-ITX) deve servir à placa-mãe.","Fluxo de ar adaptável.","Espaçadores fixam a placa sem tocar a lataria."],"Qual padrão de placa-mãe é o maior?",["Mini-ITX","Micro-ATX","ATX"],2,"Gabinetes maiores aceitam placas menores, mas não o inverso."],
["Fonte de alimentação","Converte a energia da tomada em tensões adequadas.",["A potência, em watts, deve suprir o conjunto.","A certificação 80 Plus indica eficiência.","Possui conectores para placa, CPU, GPU e SATA."],"Qual conector alimenta a placa-mãe?",["24 pinos","PCIe","SATA"],0,"É o maior conector da fonte e fornece energia à placa."],
["Placa de vídeo (GPU)","Processa imagens, vídeos e gráficos 3D.",["Encaixa no slot PCIe x16.","Possui memória própria, a VRAM.","Modelos potentes exigem cabo extra da fonte."],"Em qual slot a placa de vídeo é instalada?",["Slot de memória","M.2","PCIe x16"],2,"O PCIe x16 oferece a maior largura de banda da placa."],

const names=["Augusto Souza Castro","Davi Casteliano Costa Brito","Gabriel Victor Rodrigues Martins","Maria Eduarda Gonçalves Ramos","Marina Aparecida Fais","Otávio Tavares Soares da Costa","Samuel Douglas Mendonça Masson Alves"];
const S=[];
S.push([T,`<div class="logos in"><img class="a" src="${SESI}" alt="SESI"><img class="b" src="${SENAI}" alt="SENAI"></div><p class="tag in">Montagem de computadores</p><h1 class="big in">Guia Rápido<br><span>de Hardware</span></h1><div class="bar in"></div><ul class="names in">${names.map(x=>`<li>${x}</li>`).join('')}</ul>`]);
S.push([T,`<div class="info"><h1 class="big in" style="font-size:calc(var(--u)*8)">Mundo SENAI 2026</h1><div class="bar in"></div><p class="in"><b>Instrutores:</b> Iago Pereira Teixeira e Diogo Branquinho Auad</p><p class="in"><b>Curso:</b> Informática para Internet</p><p class="in v">Montagem de computadores, etapa por etapa.</p></div>`]);
C.forEach((c,i)=>S.push([c[0],`<div class="grid"><div><p class="step in">Etapa ${i+1} de ${C.length}</p><h1 class="in">${c[0]}</h1><p class="lead in">${c[1]}</p><ul>${c[2].map(x=>`<li class="in">${x}</li>`).join('')}</ul></div><div class="art in" role="img" aria-label="Ilustração: ${c[0]}"><svg viewBox="0 0 300 240">${A[i]}</svg></div></div>`]));
S.push(["Desafio final",`<div class="info"><h1 class="in">Desafio final</h1><div class="quiz in" id="qz"></div></div>`]);
S.push(["Encerramento",`<div class="info"><h1 class="in">Encerramento</h1><p class="in">Cada componente cumpre uma função específica, e a compatibilidade entre eles garante uma montagem bem-sucedida.</p><div class="cta in">Venha ser aluno SENAI!</div></div>`]);
const app=document.getElementById('app');
app.innerHTML=S.map((s,i)=>`<section class="s" data-t="${s[0]}">${D()}${s[1]}</section>`).join('');
const sl=[...app.children];
sl.forEach(e=>e.querySelectorAll('.in').forEach((x,i)=>x.style.setProperty('--d',i*.12+'s')));
document.getElementById('lg').src=SENAI;
let qi=0,sc=0,bad=0;
function rq(){const z=document.getElementById('qz');z.dataset.done='';if(qi>=C.length){z.innerHTML=`<h3>Resultado</h3><p>${sc} de ${C.length} acertos de primeira.</p><p style="font-weight:400">${sc>=7?'Excelente! A montagem está dominada.':sc>=4?'Bom resultado. Revisar os componentes é recomendado.':'Vale revisar os slides e refazer o desafio.'}</p><button class="nav" id="rs">Refazer desafio</button>`;return}
const c=C[qi];bad=0;z.dataset.ex=c[6];z.innerHTML=`<h3>Pergunta ${qi+1} de ${C.length} – ${c[0]}</h3><p>${c[3]}</p>${c[4].map((o,j)=>`<button class="opt"${j==c[5]?' data-ok="1"':''}>${o}</button>`).join('')}<p class="fb"></p><button class="nav" id="nq" hidden>${qi==C.length-1?'Ver resultado':'Próxima pergunta'} ›</button>`}
rq();

let c=-1,lock=0;const $=id=>document.getElementById(id);
function show(n){sl[n].classList.add('on');c=n;$('ft').textContent=T+(n>1?' – '+sl[n].dataset.t:'');$('ct').textContent=(n+1)+' / '+S.length;$('p').disabled=n==0;$('n').disabled=n==S.length-1;lock=0}
function go(n){if(lock||n<0||n>=S.length||n==c)return;lock=1;if(c<0)return show(n);const e=sl[c];e.classList.add('out');setTimeout(()=>{e.classList.remove('on','out');show(n)},420)}
$('p').onclick=()=>go(c-1);$('n').onclick=()=>go(c+1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key))go(c+1);if(['ArrowLeft','PageUp'].includes(e.key))go(c-1)});
addEventListener('pointerup',e=>{if(e.pointerType!=='touch'||e.target.closest('button'))return;const x=e.clientX/innerWidth;if(x<.12)go(c-1);if(x>.88)go(c+1)});
document.addEventListener('click',e=>{const b=e.target.closest('.opt');
if(b){const q=b.closest('.quiz');if(q.dataset.done)return;if(b.dataset.ok){b.classList.add('ok');q.dataset.done=1;if(!bad)sc++;q.querySelector('.fb').textContent='Correto! '+q.dataset.ex;$('nq').hidden=false}else{bad=1;b.classList.add('no');b.disabled=true;q.querySelector('.fb').textContent='Resposta incorreta. Tente novamente.'}}
if(e.target.id=='nq'){qi++;rq()}if(e.target.id=='rs'){qi=0;sc=0;rq()}});
go(0);
